<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Amarilla Facundo">
    <meta name="description" content="A responsive web page showing a personal temple album with images and captions.">
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@100,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

</head>

<body>
    <header>
        <h1>Temple</h1>
        <button id="menu">&#9776;</button>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temple Album</h1>
        <h2>Gallery of Temples of The Church of Jesus Christ of Latter-day Saints</h2>
        <div class="grid-container">
            <figure>
                <img src="images/temple1.webp" alt="Buenos Aires Argentina Temple" width="200">
                <figcaption>Buenos Aires Argentina Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple2.webp" alt="Córdoba Argentina Temple" width="200">
                <figcaption>Córdoba Argentina Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple3.webp" alt="Mendoza Argentina Temple" width="200">
                <figcaption>Mendoza Argentina Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple4.webp" alt="Provo City Center Temple" width="200">
                <figcaption>Provo City Center Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple5.webp" alt="Salt Lake Temple" width="200">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple6.webp" alt="Salta Argentina Temple" width="200">
                <figcaption>Salta Argentina Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple7.webp" alt="San Diego California Temple" width="200">
                <figcaption>San Diego California Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple8.webp" alt="Lima Peru Los Olivos Temple" width="200">
                <figcaption>Lima Peru Los Olivos Temple</figcaption>
            </figure>
            <figure>
                <img src="images/temple9.webp" alt="Lima Peru Temple" width="200">
                <figcaption>Lima Peru Temple</figcaption>
            </figure>


        </div>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> | Santa Fe, Argentina</p>
        <p>Last modified: <span id="lastModified"></span></p>
    </footer>

    <script src="scripts/temples.js" defer></script>
</body>

</html>
